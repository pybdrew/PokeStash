<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/defaultTemp}">
<head>
    <title th:text="${title}">Login</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-center align-items-center">
            <div class="col-md-6">
                <div class="card p-4" style="max-width: 400px; width: 100%;">
                    <form th:action="@{/register}" th:object="${userDTO}" method="post" class="row g-3 needs-validation" novalidate>
                        <div class="col-md-4">
                            <label for="validationCustom01" class="form-label">First name</label>
                            <input type="text" th:field="*{firstName}" class="form-control" id="validationCustom01" placeholder="Enter First Name" required>
                            <div class="valid-feedback">
                            Looks good!
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label for="validationCustom02" class="form-label">Last name</label>
                            <input type="text" th:field="*{lastName}" class="form-control" id="validationCustom02" placeholder="Enter Last Name" required>
                            <div class="valid-feedback">
                            Looks good!
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label for="validationCustomUsername" class="form-label">Username</label>
                            <div class="input-group has-validation">
                            <span class="input-group-text" id="inputGroupPrepend">@</span>
                            <input type="text" th:field="*{userName}" class="form-control" id="validationCustomUsername" aria-describedby="inputGroupPrepend" placeholder="Enter Username">
                            <div class="invalid-feedback">
                                Please choose a username.
                            </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label for="validationCustom02" class="form-label">Password</label>
                            <input type="password" th:field="*{password}" class="form-control" id="validationCustom02" placeholder="Enter Password" required>
                            <div class="valid-feedback">
                            Looks good!
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label for="validationCustom02" class="form-label">Confirm Password</label>
                            <input type="password" th:field="*{confirmPassword}" class="form-control" id="validationCustom02" placeholder="Confirm Password" required>
                            <div class="valid-feedback">
                            Looks good!
                            </div>
                        </div>
                        <div class="col-12">
                            <button class="btn btn-primary" type="submit">Submit form</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
